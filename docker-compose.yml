services:
  ddgs-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DDGS_PROXY
      - DDGS_WORKERS=${DDGS_WORKERS:-4}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
